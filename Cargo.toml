[package]
name = "tuicore"
version = "0.15.0"
edition = "2024"
description = "Composable ratatui components and a crossterm tree runtime for terminal UIs"
repository = "https://github.com/daure/tuicore"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["tui", "terminal", "ratatui", "crossterm", "components"]
categories = ["command-line-interface"]
include = [
    "/src/**",
    "/examples/**",
    "/tests/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
]

[dependencies]
base64 = "0.22"
crossterm = "0.29"
ratatui = { version = "0.30", features = ["widget-calendar"] }
time = { version = "0.3", features = ["local-offset"] }
toml = "0.9"
rig = "0.39"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-native-roots"] }
unicode-segmentation = "1"

[dev-dependencies]
dotenvy = { version = "0.15" }
schemars = "1"
