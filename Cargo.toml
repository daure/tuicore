[package]
name = "tuicore"
version = "0.25.0"
edition = "2024"
default-run = "gallery"
autoexamples = false
description = "Composable ratatui components and a crossterm tree runtime for terminal UIs"
repository = "https://github.com/daure/tuicore"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["tui", "terminal", "ratatui", "crossterm", "components"]
categories = ["command-line-interface"]
include = [
    "/src/**",
    "/examples/**",
    "/tests/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
]

[[bin]]
name = "gallery"
path = "examples/gallery.rs"

[[example]]
name = "ai_dock_demo"
path = "examples/ai_dock_demo.rs"

[[example]]
name = "app_shell"
path = "examples/app_shell.rs"

[[example]]
name = "calendar"
path = "examples/calendar.rs"

[[example]]
name = "data_view"
path = "examples/data_view.rs"

[[example]]
name = "dialogs"
path = "examples/dialogs.rs"

[[example]]
name = "dropdowns"
path = "examples/dropdowns.rs"

[[example]]
name = "forms"
path = "examples/forms.rs"

[[example]]
name = "layouts"
path = "examples/layouts.rs"

[[example]]
name = "list_control"
path = "examples/list_control.rs"

[[example]]
name = "scroll_container"
path = "examples/scroll_container.rs"

[dependencies]
base64 = "0.22"
crossterm = "0.29"
ratatui = { version = "0.30", features = ["widget-calendar"] }
time = { version = "0.3", features = ["local-offset"] }
toml = "0.9"
rig = "0.39"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-native-roots"] }
unicode-segmentation = "1"
pulldown-cmark = { version = "0.13", default-features = false }
similar = "2"
lumis = { version = "0.12.1", features = ["all-languages"] }
ansi-to-tui = "8.0.1"
schemars = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
ratatui-image = { version = "11.0.6", default-features = false, features = ["image-defaults", "crossterm"] }
merman = { version = "0.7", default-features = false, features = ["raster"] }

[dev-dependencies]
dotenvy = { version = "0.15" }
